<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YLE Movers 模擬測驗 - Reading Part 1</title>
    <style>
        body {
            font-family: 'Comic Sans MS', 'Arial', sans-serif; /* 童趣字體 */
            background-color: #f0f8ff;
            display: flex;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            max-width: 600px;
            width: 100%;
            border: 3px solid #FF9800;
        }
        h2 { text-align: center; color: #2196F3; }
        .instruction { color: #555; margin-bottom: 20px; text-align: center;}
        
        .word-bank {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 30px;
            padding: 10px;
            background: #FFF3E0;
            border-radius: 10px;
        }
        .word-item {
            background: #FF9800;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
        }

        .question-item {
            margin-bottom: 15px;
            padding: 10px;
            border-bottom: 1px dashed #ccc;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .question-text { width: 60%; }
        input {
            padding: 5px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            width: 30%;
        }
        
        button {
            display: block;
            width: 100%;
            padding: 15px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 20px;
        }
        button:hover { background-color: #45a049; }
        
        .result {
            margin-top: 20px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
        }
        .correct { border-color: #4CAF50; background-color: #e8f5e9; }
        .wrong { border-color: #f44336; background-color: #ffebee; }
    </style>
</head>
<body>

<div class="container">
    <h2>YLE Movers - Reading & Writing</h2>
    <p class="instruction">Part 1: Look and read. Choose the correct words and write them.</p>

    <div class="word-bank">
        <span class="word-item">a library</span>
        <span class="word-item">a shark</span>
        <span class="word-item">a blanket</span>
        <span class="word-item">a hospital</span>
    </div>

    <form id="quizForm">
        <div class="question-item">
            <div class="question-text">1. This is a place where you can find books.</div>
            <input type="text" data-answer="a library" placeholder="Type here...">
        </div>

        <div class="question-item">
            <div class="question-text">2. This animal lives in the sea and has big teeth.</div>
            <input type="text" data-answer="a shark" placeholder="Type here...">
        </div>

        <div class="question-item">
            <div class="question-text">3. You put this on your bed when it is cold.</div>
            <input type="text" data-answer="a blanket" placeholder="Type here...">
        </div>

        <button type="button" onclick="checkAnswers()">Check Answers</button>
    </form>

    <div id="resultDisplay" class="result"></div>
</div>

<script>
    function checkAnswers() {
        let inputs = document.querySelectorAll('input');
        let correctCount = 0;
        
        inputs.forEach(input => {
            // 取得使用者輸入並轉為小寫，去除前後空白
            let userAnswer = input.value.trim().toLowerCase();
            // 取得正確答案
            let correctAnswer = input.getAttribute('data-answer').toLowerCase();

            if (userAnswer === correctAnswer) {
                input.classList.add('correct');
                input.classList.remove('wrong');
                correctCount++;
            } else {
                input.classList.add('wrong');
                input.classList.remove('correct');
            }
        });

        let resultDiv = document.getElementById('resultDisplay');
        if (correctCount === inputs.length) {
            resultDiv.innerHTML = "🎉 Excellent! All correct!";
            resultDiv.style.color = "#4CAF50";
        } else {
            resultDiv.innerHTML = `You got ${correctCount} out of ${inputs.length} correct. Try again!`;
            resultDiv.style.color = "#f44336";
        }
    }
</script>

</body>
</html>
